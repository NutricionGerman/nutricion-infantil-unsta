<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Paleta Quirúrgica / Blueprint Neón -->
    <radialGradient id="cyberBg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0a192f" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#050e1a" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#020509" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="cyanLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f2fe" stroke-width="0.75" stroke-opacity="0.12"/>
      <circle cx="0" cy="0" r="1.5" fill="#00f2fe" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- FONDO Y REJILLA HOLOGRÁFICA MILIMÉTRICA -->
  <rect width="1200" height="400" fill="url(#cyberBg)"/>
  <rect width="1200" height="400" fill="url(#gridPattern)"/>

  <!-- LÍNEA LÁSER DE ESCANEO CONTINUO -->
  <g>
    <rect x="-150" y="0" width="120" height="400" fill="url(#cyanLaser)" opacity="0.35">
      <animate attributeName="x" from="-150" to="1250" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <line x1="-150" y1="0" x2="-150" y2="400" stroke="#00f2fe" stroke-width="2.5" filter="url(#cyanGlow)" opacity="0.9">
      <animate attributeName="x1" from="-150" to="1250" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="-150" to="1250" dur="4.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- DIANA QUIRÚRGICA PRINCIPAL (PUNTO ANATÓMICO CALIBRADO) -->
  <g transform="translate(600, 180)">
    <!-- Anillo exterior rotatorio con muescas -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="14,10" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Anillo medio pulsante -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#10b981" stroke-width="2" opacity="0.7" filter="url(#cyanGlow)">
      <animate attributeName="r" values="55;68;55" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#10b981;#00f2fe;#10b981" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- Cruz de Precisión Milimétrica -->
    <line x1="-105" y1="0" x2="105" y2="0" stroke="#00f2fe" stroke-width="1" stroke-dasharray="4,4" opacity="0.8"/>
    <line x1="0" y1="-105" x2="0" y2="105" stroke="#00f2fe" stroke-width="1" stroke-dasharray="4,4" opacity="0.8"/>
    
    <!-- Punto central perfecto -->
    <circle cx="0" cy="0" r="5" fill="#fff" filter="url(#cyanGlow)">
      <animate attributeName="r" values="4;7;4" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Coordenadas HUD flotantes -->
    <text x="75" y="-55" font-family="'JetBrains Mono', monospace, Consolas" font-size="10" fill="#00f2fe" opacity="0.85" font-weight="700">
      LOC: ACROMION [OK]
    </text>
    <text x="75" y="-40" font-family="'JetBrains Mono', monospace, Consolas" font-size="10" fill="#10b981" opacity="0.9" font-weight="800">
      DESVÍO: 0.0 px
    </text>
    <polyline points="65,-50 45,-35 25,-15" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.7"/>
  </g>

  <!-- CALIPER / COMPÁS DE ESPESOR DIGITAL ESTILIZADO -->
  <g transform="translate(240, 200)" opacity="0.6">
    <path d="M -60,-80 C -20,-80 20,-40 20,0 C 20,40 -20,80 -60,80" fill="none" stroke="#4facfe" stroke-width="3" stroke-linecap="round"/>
    <circle cx="20" cy="0" r="4" fill="#00f2fe" filter="url(#cyanGlow)"/>
    <line x1="-60" y1="0" x2="20" y2="0" stroke="#00f2fe" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="-50" y="-10" font-family="monospace" font-size="9" fill="#93c5fd">TÉCNICA DE PLIEGUES</text>
  </g>

  <g transform="translate(960, 200)" opacity="0.6">
    <path d="M 60,-80 C 20,-80 -20,-40 -20,0 C -20,40 20,80 60,80" fill="none" stroke="#4facfe" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-20" cy="0" r="4" fill="#00f2fe" filter="url(#cyanGlow)"/>
    <line x1="60" y1="0" x2="-20" y2="0" stroke="#00f2fe" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="-15" y="-10" font-family="monospace" font-size="9" fill="#93c5fd">ANTROPOMETRÍA CLÍNICA</text>
  </g>

  <!-- PANELES DE TELEMETRÍA INFERIOR -->
  <g transform="translate(600, 310)">
    <text x="0" y="0" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="900" fill="#00f2fe" letter-spacing="7" filter="url(#cyanGlow)">
      PRECISIÓN ANATÓMICA QUIRÚRGICA
    </text>
    <text x="0" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#a7f3d0" letter-spacing="4">
      [ CALIBRACIÓN OFICIAL · 100% FIABILIDAD ANTROPOMÉTRICA ]
    </text>
  </g>

  
</svg>