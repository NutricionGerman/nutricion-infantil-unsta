<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Paleta de Degradados de Oro de Lujo -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2d2208" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#141008" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#06070a" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="goldShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bf953f">
        <animate attributeName="stop-color" values="#bf953f; #fcf6ba; #b38728; #fbf5b7; #bf953f" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="25%" stop-color="#fcf6ba">
        <animate attributeName="stop-color" values="#fcf6ba; #b38728; #fbf5b7; #bf953f; #fcf6ba" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#b38728">
        <animate attributeName="stop-color" values="#b38728; #fbf5b7; #bf953f; #fcf6ba; #b38728" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="75%" stop-color="#fbf5b7">
        <animate attributeName="stop-color" values="#fbf5b7; #bf953f; #fcf6ba; #b38728; #fbf5b7" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#aa771c">
        <animate attributeName="stop-color" values="#aa771c; #fcf6ba; #b38728; #fbf5b7; #aa771c" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- FONDO PROFUNDO -->
  <rect width="1200" height="400" fill="url(#bgGlow)"/>

  <!-- RAYOS DE LUZ ROTATORIOS EN EL CENTRO -->
  <g transform="translate(600, 200)" opacity="0.45">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      <!-- Haz de 12 rayos -->
      <polygon points="0,0 -80,-500 80,-500" fill="url(#beamGrad)"/>
      <polygon points="0,0 -80,500 80,500" fill="url(#beamGrad)"/>
      <polygon points="0,0 -500,-80 -500,80" fill="url(#beamGrad)"/>
      <polygon points="0,0 500,-80 500,80" fill="url(#beamGrad)"/>
      <polygon points="0,0 -350,-350 -250,-420" fill="url(#beamGrad)"/>
      <polygon points="0,0 350,350 250,420" fill="url(#beamGrad)"/>
      <polygon points="0,0 -350,350 -250,420" fill="url(#beamGrad)"/>
      <polygon points="0,0 350,-350 250,-420" fill="url(#beamGrad)"/>
    </g>
  </g>

  <!-- ONDAS CONCENTRICAS DE ENERGIA DORADA -->
  <circle cx="600" cy="200" r="160" fill="none" stroke="url(#goldShimmer)" stroke-width="1.5" opacity="0.5">
    <animate attributeName="r" values="140;220;140" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="200" r="230" fill="none" stroke="#ffd700" stroke-width="1" stroke-dasharray="6,8" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="0 600 200" to="-360 600 200" dur="60s" repeatCount="indefinite"/>
  </circle>

  <!-- GEOMETRÍA SAGRADA DE PODIO CENTRAL -->
  <g transform="translate(600, 185)" filter="url(#goldGlow)">
    <!-- Corona de Laureles estilizada -->
    <path d="M -90,-20 C -140,-60 -150,40 -90,70 C -70,50 -70,10 -90,-20 Z" fill="url(#goldShimmer)" opacity="0.85">
      <animate attributeName="transform" type="translate" values="0,0; -5,-3; 0,0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 90,-20 C 140,-60 150,40 90,70 C 70,50 70,10 90,-20 Z" fill="url(#goldShimmer)" opacity="0.85">
      <animate attributeName="transform" type="translate" values="0,0; 5,-3; 0,0" dur="3s" repeatCount="indefinite"/>
    </path>

    <!-- Corona Triunfal Superior -->
    <path d="M -45,-55 L -30,-25 L 0,-65 L 30,-25 L 45,-55 L 40, -10 L -40, -10 Z" fill="url(#goldShimmer)">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="0" cy="-72" r="5" fill="#ffffff" filter="url(#intenseGlow)">
      <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-45" cy="-62" r="3.5" fill="#ffffff"/>
    <circle cx="45" cy="-62" r="3.5" fill="#ffffff"/>

    <!-- Estrella de Victoria Central -->
    <polygon points="0,-15 5,-2 18,-2 8,6 12,18 0,10 -12,18 -8,6 -18,-2 -5,-2" fill="#fff" filter="url(#intenseGlow)">
      <animate attributeName="transform" type="scale" values="1; 1.15; 1" dur="2.5s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- MARCO PERIMETRAL DE ORO CON ESQUINAS ART DECO -->
  <g stroke="url(#goldShimmer)" fill="none" stroke-width="2" opacity="0.75">
    <rect x="20" y="20" width="1160" height="360" rx="14" stroke-dasharray="16,8"/>
    <!-- Esquinas ornamentales -->
    <path d="M 20,50 L 50,20 M 1180,50 L 1150,20 M 20,350 L 50,380 M 1180,350 L 1150,380" stroke-width="3"/>
    <circle cx="50" cy="50" r="4" fill="url(#goldShimmer)"/>
    <circle cx="1150" cy="50" r="4" fill="url(#goldShimmer)"/>
    <circle cx="50" cy="350" r="4" fill="url(#goldShimmer)"/>
    <circle cx="1150" cy="350" r="4" fill="url(#goldShimmer)"/>
  </g>

  <!-- TEXTO INSIGNIA ACADÉMICA -->
  <text x="600" y="285" text-anchor="middle" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="14" font-weight="800" fill="url(#goldShimmer)" letter-spacing="9" opacity="0.95">
    CÁTEDRA DE NUTRICIÓN INFANTIL · UNSTA
  </text>
  <text x="600" y="315" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffd700" letter-spacing="6" opacity="0.75">
    ★ PRIMER PUESTO · EXCELENCIA ACADÉMICA ★
  </text>

  <!-- POLVO DE ORO ASCENDENTE (PARTÍCULAS FLOTANTES) -->
  <g fill="#fef3c7" filter="url(#goldGlow)">
    <circle cx="180" cy="320" r="2.5">
      <animate attributeName="cy" values="380;40" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="280" r="3.2">
      <animate attributeName="cy" values="380;30" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="350" r="2">
      <animate attributeName="cy" values="380;50" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="340" r="2.8">
      <animate attributeName="cy" values="380;40" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="890" cy="300" r="3.5">
      <animate attributeName="cy" values="380;30" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="360" r="2.2">
      <animate attributeName="cy" values="380;60" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="6.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>