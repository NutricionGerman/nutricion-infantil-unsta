<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Nebulosa Cósmica Profunda -->
    <radialGradient id="spaceNebula" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#1f1147" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#0d1633" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#03040a" stop-opacity="1"/>
    </radialGradient>

    <!-- Resplandor de Estrella -->
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="cometTail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#7dd3fc" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="constelLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- FONDO ESPACIAL -->
  <rect width="1200" height="400" fill="url(#spaceNebula)"/>

  <!-- NUBE DE POLVO CÓSMICO (NEBULOSA VIBRANTE) -->
  <circle cx="600" cy="190" r="180" fill="#6366f1" opacity="0.12" filter="url(#starGlow)">
    <animate attributeName="r" values="160;210;160" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.22;0.1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="160" r="140" fill="#ec4899" opacity="0.09" filter="url(#starGlow)">
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- ASTROLABIO CELESTE ROTATORIO -->
  <g transform="translate(600, 190)" opacity="0.35">
    <circle cx="0" cy="0" r="130" fill="none" stroke="#a5b4fc" stroke-width="1.2" stroke-dasharray="10,12">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="90s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="6,16">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="120s" repeatCount="indefinite"/>
    </circle>
    <ellipse cx="0" cy="0" rx="140" ry="50" fill="none" stroke="#c084fc" stroke-width="1" stroke-dasharray="8,8">
      <animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="60s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- CONSTELACIÓN PEDIÁTRICA CENTRAL (LÍNEAS VECTORIALES CONECTADAS) -->
  <g filter="url(#starGlow)">
    <polyline points="280,240 380,150 480,180 600,100 720,180 820,150 920,240" 
              fill="none" stroke="url(#constelLineGrad)" stroke-width="2" stroke-dasharray="8,4">
      <animate attributeName="stroke-dashoffset" values="0; 48" dur="4s" repeatCount="indefinite"/>
    </polyline>
    <line x1="600" y1="100" x2="600" y2="240" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.6"/>
    <line x1="480" y1="180" x2="600" y2="240" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
    <line x1="720" y1="180" x2="600" y2="240" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
  </g>

  <!-- NODOS ESTELARES PRINCIPALES (ESTRELLAS DE LA CONSTELACIÓN) -->
  <g filter="url(#starGlow)">
    <!-- Estrella Alfa (Centro Superior) -->
    <g transform="translate(600, 100)">
      <circle cx="0" cy="0" r="7" fill="#ffffff"/>
      <circle cx="0" cy="0" r="14" fill="#a855f7" opacity="0.5">
        <animate attributeName="r" values="10;18;10" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- Estrella Beta -->
    <circle cx="480" cy="180" r="5" fill="#38bdf8">
      <animate attributeName="r" values="4;6.5;4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Estrella Gamma -->
    <circle cx="720" cy="180" r="5" fill="#38bdf8">
      <animate attributeName="r" values="4;6.5;4" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- Estrella Delta -->
    <circle cx="380" cy="150" r="4.5" fill="#c084fc">
      <animate attributeName="r" values="3.5;6;3.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <!-- Estrella Epsilon -->
    <circle cx="820" cy="150" r="4.5" fill="#c084fc">
      <animate attributeName="r" values="3.5;6;3.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- Estrella Polar Central -->
    <circle cx="600" cy="240" r="6" fill="#fef08a">
      <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Extremos -->
    <circle cx="280" cy="240" r="4" fill="#93c5fd"/>
    <circle cx="920" cy="240" r="4" fill="#93c5fd"/>
  </g>

  <!-- COMETAS / ESTRELLAS FUGACES CRUZANDO -->
  <g opacity="0.85">
    <path d="M 0,0 L 90,60" stroke="url(#cometTail)" stroke-width="2.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="-150,-50; 1300,500" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M 0,0 L 70,45" stroke="url(#cometTail)" stroke-width="1.8" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="400,-100; 1400,450" dur="11s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ESTRELLAS DE FONDO TITILANTES -->
  <g fill="#ffffff">
    <circle cx="150" cy="90" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="320" r="2"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="60" r="1.2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="340" r="1.8"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="70" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="310" r="2.2"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="110" r="1.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="270" r="1.8"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- TEXTO INFERIOR -->
  <g transform="translate(600, 320)">
    <text x="0" y="0" text-anchor="middle" font-family="'Cinzel', 'Trajan Pro', Georgia, serif" font-size="14" font-weight="800" fill="#e0e7ff" letter-spacing="8" filter="url(#starGlow)">
      CONSTELACIÓN ACADÉMICA PEDIÁTRICA
    </text>
    <text x="0" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#a5b4fc" letter-spacing="5">
      ★ CUADRO DE HONOR Y CIENCIA · CÁTEDRA UNSTA ★
    </text>
  </g>

  <!-- MARCO FINO PERIMETRAL -->
  <rect x="25" y="25" width="1150" height="350" rx="14" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="14,14"/>
</svg>