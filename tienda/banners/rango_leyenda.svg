<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Fondo Abismal Mítico Ultra Profundo -->
    <radialGradient id="abyssBg" cx="50%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#220b30" stop-opacity="0.98"/>
      <stop offset="40%" stop-color="#12041c" stop-opacity="0.99"/>
      <stop offset="100%" stop-color="#040108" stop-opacity="1"/>
    </radialGradient>

    <!-- Gradiente Cromático Radiante Prisma (Leyenda 40 XP) -->
    <linearGradient id="radiantPrism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4757">
        <animate attributeName="stop-color" values="#ff4757; #ffa502; #2ed573; #1e90ff; #9b59b6; #ff4757" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="25%" stop-color="#ffa502">
        <animate attributeName="stop-color" values="#ffa502; #2ed573; #1e90ff; #9b59b6; #ff4757; #ffa502" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#2ed573">
        <animate attributeName="stop-color" values="#2ed573; #1e90ff; #9b59b6; #ff4757; #ffa502; #2ed573" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="75%" stop-color="#1e90ff">
        <animate attributeName="stop-color" values="#1e90ff; #9b59b6; #ff4757; #ffa502; #2ed573; #1e90ff" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#9b59b6">
        <animate attributeName="stop-color" values="#9b59b6; #ff4757; #ffa502; #2ed573; #1e90ff; #9b59b6" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Rayos de Energía Lateral (Izquierda y Derecha) -->
    <linearGradient id="streamLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4757" stop-opacity="0"/>
      <stop offset="60%" stop-color="#ffa502" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2ed573" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="streamRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ed573" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#1e90ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9b59b6" stop-opacity="0"/>
    </linearGradient>

    <!-- Resplandor Radiante -->
    <filter id="radiantGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="intenseFlash" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. FONDO SIN BORDES RÍGIDOS (FULL-BLEED SEAMLESS) -->
  <rect width="1200" height="400" fill="url(#abyssBg)"/>

  <!-- 2. AURORAS LATERALES Y RISTRAS DE ENERGÍA HORIZONTAL (EFECTOS EN LOS COSTADOS) -->
  <!-- Flanco Izquierdo -->
  <g opacity="0.75" filter="url(#radiantGlow)">
    <path d="M 0,185 Q 160,160 320,195 T 480,200" fill="none" stroke="url(#streamLeft)" stroke-width="2.5">
      <animate attributeName="stroke-dasharray" values="0,600; 600,0; 0,600" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 0,215 Q 180,240 340,205 T 480,200" fill="none" stroke="url(#streamLeft)" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="600,0; 0,600; 600,0" dur="4.5s" repeatCount="indefinite"/>
    </path>
    <!-- Chevrons / Flechas de Poder Lateral Izquierdas -->
    <path d="M 160,190 L 175,200 L 160,210" fill="none" stroke="#ffa502" stroke-width="2" stroke-linecap="round" opacity="0.8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 190,190 L 205,200 L 190,210" fill="none" stroke="#2ed573" stroke-width="2" stroke-linecap="round" opacity="0.6">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Flanco Derecho -->
  <g opacity="0.75" filter="url(#radiantGlow)">
    <path d="M 720,200 Q 860,165 1020,205 T 1200,185" fill="none" stroke="url(#streamRight)" stroke-width="2.5">
      <animate attributeName="stroke-dasharray" values="0,600; 600,0; 0,600" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 720,200 Q 880,235 1040,195 T 1200,215" fill="none" stroke="url(#streamRight)" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="600,0; 0,600; 600,0" dur="4.5s" repeatCount="indefinite"/>
    </path>
    <!-- Chevrons / Flechas de Poder Lateral Derechas -->
    <path d="M 1040,190 L 1025,200 L 1040,210" fill="none" stroke="#1e90ff" stroke-width="2" stroke-linecap="round" opacity="0.8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 1010,190 L 995,200 L 1010,210" fill="none" stroke="#9b59b6" stroke-width="2" stroke-linecap="round" opacity="0.6">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 3. HAZ DE LUZ RADIANTE CENTRAL Y ONDAS DE CHOQUE EXPANSIVAS -->
  <circle cx="600" cy="200" r="85" fill="none" stroke="url(#radiantPrism)" stroke-width="2" opacity="0.65" filter="url(#radiantGlow)">
    <animate attributeName="r" values="70;190;70" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.05;0.8" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="2.5;0.5;2.5" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ANILLOS RÚNICOS CENTRALES COMPACTOS (ROTACIÓN OPUESTA) -->
  <g transform="translate(600, 200)" opacity="0.55">
    <circle cx="0" cy="0" r="95" fill="none" stroke="url(#radiantPrism)" stroke-width="1.5" stroke-dasharray="10,8,4,8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="115" fill="none" stroke="#2ed573" stroke-width="1" stroke-dasharray="6,12">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="40s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 4. INSIGNIA LEYENDA CENTRAL: PERFECTAMENTE CENTRADA (Y=200) Y ESCALADA AL 68% -->
  <!-- Esto garantiza que en la fila de ranking (altura 60px) se vea 100% entera sin cortarse -->
  <g transform="translate(600, 200) scale(0.68)" filter="url(#radiantGlow)">
    <!-- Alas de Fuego Curvo Radiante Izquierda -->
    <path d="M 0,40 C -40,30 -90,10 -120,-30 C -105,-10 -70,5 -50,-10 C -75,-35 -85,-70 -60,-85 C -55,-60 -35,-40 -20,-20 C -25,-45 -20,-80 0,-105 C 0,-70 -10,-40 0,-15 Z" 
          fill="url(#radiantPrism)" opacity="0.95">
      <animate attributeName="transform" type="scale" values="1;1.05;1" dur="2.2s" repeatCount="indefinite"/>
    </path>

    <!-- Alas de Fuego Curvo Radiante Derecha (Espejada) -->
    <path d="M 0,40 C 40,30 90,10 120,-30 C 105,-10 70,5 50,-10 C 75,-35 85,-70 60,-85 C 55,-60 35,-40 20,-20 C 25,-45 20,-80 0,-105 C 0,-70 10,-40 0,-15 Z" 
          fill="url(#radiantPrism)" opacity="0.95">
      <animate attributeName="transform" type="scale" values="1;1.05;1" dur="2.2s" repeatCount="indefinite"/>
    </path>

    <!-- Corona Radiante Superior -->
    <path d="M -30,-45 L 0,-85 L 30,-45 L 18,-30 L 0,-45 L -18,-30 Z" fill="#ffffff" filter="url(#intenseFlash)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="1.5s" repeatCount="indefinite"/>
    </path>

    <!-- Núcleo de Diamante Radiante -->
    <polygon points="0,-18 14,0 0,18 -14,0" fill="#ffffff" filter="url(#intenseFlash)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </polygon>
    <circle cx="0" cy="0" r="5" fill="#fef08a"/>
  </g>

  <!-- 5. CONSTELACIÓN DE CHISPAS PRISMÁTICAS DISTRIBUIDAS A LO LARGO DE TODO EL ANCHO -->
  <g filter="url(#radiantGlow)">
    <!-- Flanco Izquierdo -->
    <circle cx="90" cy="220" r="2.5" fill="#ff4757"><animate attributeName="cy" values="240;160;240" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="180" r="3" fill="#ffa502"><animate attributeName="cy" values="160;240;160" dur="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;1;0.4" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="210" r="2.5" fill="#2ed573"><animate attributeName="cy" values="230;170;230" dur="3.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;1;0.5" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="190" r="3.2" fill="#1e90ff"><animate attributeName="cy" values="170;230;170" dur="4.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;1;0.4" dur="4.2s" repeatCount="indefinite"/></circle>

    <!-- Flanco Derecho -->
    <circle cx="750" cy="190" r="3.2" fill="#2ed573"><animate attributeName="cy" values="170;230;170" dur="4.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;1;0.4" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="210" r="2.5" fill="#1e90ff"><animate attributeName="cy" values="230;170;230" dur="3.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;1;0.5" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="990" cy="180" r="3" fill="#9b59b6"><animate attributeName="cy" values="160;240;160" dur="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;1;0.4" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="220" r="2.5" fill="#ff4757"><animate attributeName="cy" values="240;160;240" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 6. TEXTO HERÁLDICO DISCRETO INFERIOR (UBICADO CERCA DE LA BASE PARA NO COLISIONAR) -->
  <g transform="translate(600, 345)">
    <text x="0" y="0" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="900" fill="url(#radiantPrism)" letter-spacing="8" filter="url(#radiantGlow)">
      RANGO LEYENDA · 40 XP
    </text>
    <text x="0" y="20" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#ffa502" letter-spacing="4">
      ★ STATUS RADIANT · ELITE CÁTEDRA DE NUTRICIÓN UNSTA ★
    </text>
  </g>
</svg>