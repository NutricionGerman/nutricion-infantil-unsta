<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Fondo Nocturno Imperial con Gradiente Radial Profundo (Sin bordes rígidos) -->
    <radialGradient id="honorBgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e1848" stop-opacity="0.98"/>
      <stop offset="35%" stop-color="#0f122c" stop-opacity="0.99"/>
      <stop offset="75%" stop-color="#060814" stop-opacity="1"/>
      <stop offset="100%" stop-color="#020308" stop-opacity="1"/>
    </radialGradient>

    <!-- Gradiente Shimmer de Oro Vivo Animado -->
    <linearGradient id="goldShimmerAnim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706">
        <animate attributeName="stop-color" values="#d97706; #fde047; #b45309; #fef08a; #d97706" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="25%" stop-color="#fef08a">
        <animate attributeName="stop-color" values="#fef08a; #b45309; #fef08a; #d97706; #fef08a" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#b45309">
        <animate attributeName="stop-color" values="#b45309; #fef08a; #d97706; #fde047; #b45309" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="75%" stop-color="#fde047">
        <animate attributeName="stop-color" values="#fde047; #d97706; #fde047; #b45309; #fde047" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#d97706">
        <animate attributeName="stop-color" values="#d97706; #fde047; #b45309; #fef08a; #d97706" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Resplandor Dorado Suave -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. FONDO FULL-BLEED SEAMLESS (Sin líneas ni rectángulos con bordes punteados) -->
  <rect width="1200" height="400" fill="url(#honorBgGlow)"/>

  <!-- 2. AURA CENTRAL MÍSTICA EN EL NÚCLEO (Y=200) -->
  <circle cx="600" cy="200" r="180" fill="#6366f1" opacity="0.18">
    <animate attributeName="r" values="160; 200; 160" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.12; 0.22; 0.12" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- 3. RAYOS SUTILES DE GLORIA ROTATORIOS -->
  <g transform="translate(600, 200)" opacity="0.12">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="50s" repeatCount="indefinite"/>
      <circle r="130" fill="none" stroke="#fde047" stroke-width="1" stroke-dasharray="6 14"/>
      <circle r="190" fill="none" stroke="#818cf8" stroke-width="0.8" stroke-dasharray="8 20"/>
      <path d="M-600,0 L600,0" stroke="#fef08a" stroke-width="1" stroke-dasharray="8 24"/>
      <path d="M0,-300 L0,300" stroke="#fef08a" stroke-width="1" stroke-dasharray="8 24"/>
      <path d="M-420,-210 L420,210" stroke="#fde047" stroke-width="0.8" stroke-dasharray="6 20"/>
      <path d="M-420,210 L420,-210" stroke="#fde047" stroke-width="0.8" stroke-dasharray="6 20"/>
    </g>
  </g>

  <!-- 4. PARTÍCULAS TITILANTES DECORATIVAS (Dispersas a lo largo de todo el ancho) -->
  <g fill="#fef08a">
    <circle cx="160" cy="200" r="1.8" opacity="0.7"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="180" r="2.2" opacity="0.8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="210" r="1.5" opacity="0.6"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="190" r="1.5" opacity="0.6"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="220" r="2.2" opacity="0.8"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="195" r="1.8" opacity="0.7"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 5. INSIGNIA CENTRAL COMPACTA (Centrada matemáticamente en Y=200, Altura Total ~110px) -->
  <!-- Esto garantiza que en la fila de ranking (altura 60px) y en la cabecera de perfil quepa 100% entera sin tapar nombres ni cortarse -->
  <g transform="translate(600, 200)">

    <!-- LAURELES SIMÉTRICOS DORADOS (Compactos alrededor del texto) -->
    <g fill="url(#goldShimmerAnim)" opacity="0.85" filter="url(#softGlow)">
      <!-- Rama Izquierda -->
      <g transform="translate(-195, 0)">
        <path d="M15,40 Q-35,15 -25,-30 Q-15,-48 0,-55" fill="none" stroke="url(#goldShimmerAnim)" stroke-width="2"/>
        <!-- Hojas -->
        <path d="M-2,-52 Q-14,-52 -10,-40 Q-2,-40 -2,-52 Z"/>
        <path d="M-10,-40 Q-24,-38 -18,-28 Q-6,-30 -10,-40 Z"/>
        <path d="M-18,-24 Q-32,-18 -26,-8 Q-12,-12 -18,-24 Z"/>
        <path d="M-22,-4 Q-36,5 -28,15 Q-15,6 -22,-4 Z"/>
        <path d="M-20,16 Q-32,30 -20,38 Q-10,25 -20,16 Z"/>
        <path d="M-12,34 Q-20,48 -8,52 Q-2,40 -12,34 Z"/>
      </g>
      <!-- Rama Derecha (Espejo) -->
      <g transform="translate(195, 0) scale(-1, 1)">
        <path d="M15,40 Q-35,15 -25,-30 Q-15,-48 0,-55" fill="none" stroke="url(#goldShimmerAnim)" stroke-width="2"/>
        <!-- Hojas -->
        <path d="M-2,-52 Q-14,-52 -10,-40 Q-2,-40 -2,-52 Z"/>
        <path d="M-10,-40 Q-24,-38 -18,-28 Q-6,-30 -10,-40 Z"/>
        <path d="M-18,-24 Q-32,-18 -26,-8 Q-12,-12 -18,-24 Z"/>
        <path d="M-22,-4 Q-36,5 -28,15 Q-15,6 -22,-4 Z"/>
        <path d="M-20,16 Q-32,30 -20,38 Q-10,25 -20,16 Z"/>
        <path d="M-12,34 Q-20,48 -8,52 Q-2,40 -12,34 Z"/>
      </g>
    </g>

    <!-- CORONA REAL COMPACTA (Directamente sobre el título) -->
    <g transform="translate(0, -42) scale(0.65)" filter="url(#softGlow)">
      <path d="M-30,12 L-35,-10 L-15,0 L0,-18 L15,0 L35,-10 L30,12 Z" fill="url(#goldShimmerAnim)"/>
      <circle cx="-35" cy="-10" r="2.5" fill="#ffffff"/>
      <circle cx="-15" cy="0" r="2.2" fill="#818cf8"/>
      <circle cx="0" cy="-18" r="3.2" fill="#ffffff" filter="url(#intenseGlow)"/>
      <circle cx="15" cy="0" r="2.2" fill="#818cf8"/>
      <circle cx="35" cy="-10" r="2.5" fill="#ffffff"/>
      <rect x="-30" y="12" width="60" height="4" rx="1.5" fill="#fef08a"/>
    </g>

    <!-- TEXTOS ACADÉMICOS TIPOGRÁFICOS PERFECTAMENTE PROPORCIONADOS -->
    <g text-anchor="middle" font-family="'Segoe UI', -apple-system, Roboto, sans-serif">
      <!-- TÍTULO PRINCIPAL: CUADRO DE HONOR (Tamaño ideal 21px, no gigante) -->
      <text x="0" y="-3" font-size="21" font-weight="900" fill="url(#goldShimmerAnim)" filter="url(#softGlow)" letter-spacing="3.5">
        CUADRO DE HONOR
      </text>
      <text x="0" y="-3" font-size="21" font-weight="900" fill="#ffffff" letter-spacing="3.5" opacity="0.95">
        CUADRO DE HONOR
      </text>

      <!-- SUBTÍTULO: 2° PARCIAL TEÓRICO · MESA ORAL -->
      <text x="0" y="21" font-size="12" font-weight="800" fill="#cbd5e1" letter-spacing="3">
        2° PARCIAL TEÓRICO · MESA ORAL
      </text>

      <!-- DISTINCIÓN DE EXCELENCIA PEDIÁTRICA -->
      <g transform="translate(0, 38)">
        <rect x="-140" y="-10" width="280" height="20" rx="10" fill="rgba(15, 23, 42, 0.75)" stroke="url(#goldShimmerAnim)" stroke-width="1"/>
        <text x="0" y="4" font-size="9.5" font-weight="800" fill="#fef08a" letter-spacing="1.5">
          👑 EXCELENCIA · PROMEDIO ≥ 9.0 · +10 XP 👑
        </text>
      </g>
    </g>

  </g>
</svg>
