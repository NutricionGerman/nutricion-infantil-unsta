<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Fondo Clínico Oscuro Moderno -->
    <radialGradient id="omsBg" cx="50%" cy="50%" r="85%">
      <stop offset="0%" stop-color="#0e1726" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#080d17" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#03050a" stop-opacity="1"/>
    </radialGradient>

    <!-- Resplandor Clínico Cyan -->
    <filter id="clinicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="medianGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Cuadrícula Médica Pediátrica -->
    <pattern id="omsGrid" width="60" height="35" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 35" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.08"/>
      <line x1="0" y1="17.5" x2="60" y2="17.5" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.04" stroke-dasharray="2,4"/>
    </pattern>
  </defs>

  <!-- FONDO Y REJILLA DE PERCENTILES -->
  <rect width="1200" height="400" fill="url(#omsBg)"/>
  <rect width="1200" height="400" fill="url(#omsGrid)"/>

  <!-- EJE X / EDAD EN MESES Y EJE Y / Z-SCORE -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.35">
    <line x1="80" y1="310" x2="1140" y2="310"/>
    <line x1="80" y1="50" x2="80" y2="310"/>
    <!-- Marcas de Edad -->
    <line x1="280" y1="310" x2="280" y2="318"/>
    <line x1="480" y1="310" x2="480" y2="318"/>
    <line x1="680" y1="310" x2="680" y2="318"/>
    <line x1="880" y1="310" x2="880" y2="318"/>
    <line x1="1080" y1="310" x2="1080" y2="318"/>
  </g>

  <!-- ETIQUETAS DE EJE -->
  <g font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" opacity="0.7">
    <text x="80" y="330">0m</text>
    <text x="280" y="330">12m</text>
    <text x="480" y="330">24m</text>
    <text x="680" y="330">36m</text>
    <text x="880" y="330">48m</text>
    <text x="1080" y="330">60m</text>
    
    <text x="45" y="85">+3 DE</text>
    <text x="45" y="130">+2 DE</text>
    <text x="45" y="175"> 0 (P50)</text>
    <text x="45" y="220">-2 DE</text>
    <text x="45" y="265">-3 DE</text>
  </g>

  <!-- CURVAS OFICIALES DE CRECIMIENTO OMS (Z-SCORES) -->
  <g fill="none">
    <!-- Curva +3 DE (Riesgo superior) -->
    <path d="M 80,110 Q 400,90 700,75 T 1140,60" stroke="#f43f5e" stroke-width="1.2" opacity="0.45" stroke-dasharray="6,6"/>
    
    <!-- Curva +2 DE -->
    <path d="M 80,140 Q 400,120 700,105 T 1140,90" stroke="#fb923c" stroke-width="1.5" opacity="0.6"/>

    <!-- Curva +1 DE -->
    <path d="M 80,165 Q 400,145 700,132 T 1140,120" stroke="#38bdf8" stroke-width="1.2" opacity="0.5" stroke-dasharray="4,4"/>

    <!-- CURVA MEDIANA (Z = 0 / PERCENTIL 50) - RESALTADA CON PULSO -->
    <path id="medianPath" d="M 80,195 Q 400,180 700,165 T 1140,150" stroke="url(#medianGrad)" stroke-width="3" filter="url(#clinicGlow)">
      <animate attributeName="stroke-width" values="2.8;3.8;2.8" dur="4s" repeatCount="indefinite"/>
    </path>

    <!-- Curva -1 DE -->
    <path d="M 80,225 Q 400,215 700,202 T 1140,190" stroke="#38bdf8" stroke-width="1.2" opacity="0.5" stroke-dasharray="4,4"/>

    <!-- Curva -2 DE -->
    <path d="M 80,250 Q 400,245 700,235 T 1140,225" stroke="#fb923c" stroke-width="1.5" opacity="0.6"/>

    <!-- Curva -3 DE (Riesgo inferior) -->
    <path d="M 80,275 Q 400,272 700,268 T 1140,260" stroke="#f43f5e" stroke-width="1.2" opacity="0.45" stroke-dasharray="6,6"/>
  </g>

  <!-- INDICADOR ACTIVO / ESCÁNER DESLIZANTE SOBRE LA MEDIANA -->
  <g filter="url(#clinicGlow)">
    <circle r="7" fill="#00f2fe">
      <animateMotion path="M 80,195 Q 400,180 700,165 T 1140,150" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="14" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.7">
      <animateMotion path="M 80,195 Q 400,180 700,165 T 1140,150" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="10;18;10" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- TARJETA HUD FLOTANTE DE DIAGNÓSTICO EUTRÓFICO -->
  <g transform="translate(620, 80)" filter="url(#clinicGlow)">
    <rect x="0" y="0" width="220" height="45" rx="8" fill="#0b1329" stroke="#10b981" stroke-width="1.5" opacity="0.9"/>
    <circle cx="20" cy="22" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="35" y="19" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#a7f3d0">
      Z-SCORE: 0.00 [EUTRÓFICO]
    </text>
    <text x="35" y="34" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#38bdf8">
      P50 · CRECIMIENTO ÓPTIMO OMS
    </text>
  </g>

  <!-- TEXTO INFERIOR CLÍNICO -->
  <g transform="translate(600, 360)">
    <text x="0" y="0" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="13.5" font-weight="900" fill="#38bdf8" letter-spacing="7" filter="url(#clinicGlow)">
      PATRONES DE CRECIMIENTO OMS &amp; ANTROPOMETRÍA
    </text>
    <text x="0" y="20" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#94a3b8" letter-spacing="4">
      [ EVALUACIÓN NUTRICIONAL · CÁTEDRA NUTRICIÓN INFANTIL UNSTA ]
    </text>
  </g>

  
</svg>