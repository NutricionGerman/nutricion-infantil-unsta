<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Fondo Volcánico Profundo -->
    <radialGradient id="fireBg" cx="50%" cy="80%" r="85%">
      <stop offset="0%" stop-color="#450a0a" stop-opacity="0.98"/>
      <stop offset="45%" stop-color="#1f0404" stop-opacity="0.99"/>
      <stop offset="100%" stop-color="#080202" stop-opacity="1"/>
    </radialGradient>

    <!-- Degradados del Fuego -->
    <linearGradient id="flameGradRed" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#dc2626" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="flameGradOrange" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="flameGradYellow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="1"/>
      <stop offset="50%" stop-color="#fef08a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="heatGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="sparkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- FONDO VOLCÁNICO -->
  <rect width="1200" height="400" fill="url(#fireBg)"/>

  <!-- CAPA 1: LLAMAS PROFUNDAS ROJAS -->
  <path d="M 0,400 L 0,280 Q 150,220 300,280 T 600,260 T 900,270 T 1200,250 L 1200,400 Z" fill="url(#flameGradRed)" opacity="0.8">
    <animate attributeName="d" 
      values="M 0,400 L 0,280 Q 150,220 300,280 T 600,260 T 900,270 T 1200,250 L 1200,400 Z;
              M 0,400 L 0,250 Q 150,290 300,240 T 600,290 T 900,240 T 1200,280 L 1200,400 Z;
              M 0,400 L 0,280 Q 150,220 300,280 T 600,260 T 900,270 T 1200,250 L 1200,400 Z" 
      dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- CAPA 2: LLAMAS MEDIAS NARANJAS -->
  <path d="M 0,400 L 0,310 Q 180,240 360,310 T 720,290 T 1080,300 T 1200,280 L 1200,400 Z" fill="url(#flameGradOrange)" opacity="0.85">
    <animate attributeName="d" 
      values="M 0,400 L 0,310 Q 180,240 360,310 T 720,290 T 1080,300 T 1200,280 L 1200,400 Z;
              M 0,400 L 0,290 Q 180,330 360,280 T 720,320 T 1080,270 T 1200,310 L 1200,400 Z;
              M 0,400 L 0,310 Q 180,240 360,310 T 720,290 T 1080,300 T 1200,280 L 1200,400 Z" 
      dur="3.2s" repeatCount="indefinite"/>
  </path>

  <!-- CAPA 3: NÚCLEO ARDIENTE AMARILLO VIVO -->
  <path d="M 0,400 L 0,350 Q 200,290 400,350 T 800,330 T 1200,340 L 1200,400 Z" fill="url(#flameGradYellow)" opacity="0.9">
    <animate attributeName="d" 
      values="M 0,400 L 0,350 Q 200,290 400,350 T 800,330 T 1200,340 L 1200,400 Z;
              M 0,400 L 0,330 Q 200,370 400,320 T 800,360 T 1200,330 L 1200,400 Z;
              M 0,400 L 0,350 Q 200,290 400,350 T 800,330 T 1200,340 L 1200,400 Z" 
      dur="2.5s" repeatCount="indefinite"/>
  </path>

  <!-- EMBLEMA CENTRAL DE LLAMA SAGRADA -->
  <g transform="translate(600, 160)" filter="url(#heatGlow)">
    <!-- Aura de Fuego Exterior -->
    <path d="M 0,-70 C 40,-30 70,0 70,40 C 70,80 40,100 0,100 C -40,100 -70,80 -70,40 C -70,0 -40,-30 0,-70 Z" fill="url(#flameGradOrange)" opacity="0.8">
      <animate attributeName="transform" type="scale" values="1;1.08;1" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- Llama Media -->
    <path d="M 0,-50 C 28,-20 48,0 48,30 C 48,60 28,75 0,75 C -28,75 -48,60 -48,30 C -48,0 -28,-20 0,-50 Z" fill="url(#flameGradYellow)" opacity="0.9">
      <animate attributeName="transform" type="scale" values="1.05;0.96;1.05" dur="1.7s" repeatCount="indefinite"/>
    </path>
    <!-- Núcleo Blanco Incandescente -->
    <path d="M 0,-25 C 14,-10 24,0 24,18 C 24,35 14,45 0,45 C -14,45 -24,35 -24,18 C -24,0 -14,-10 0,-25 Z" fill="#ffffff" opacity="0.95">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="1.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- CHISPAS / EMBERS FLOTANTES ASCENDENTES -->
  <g fill="#fef08a" filter="url(#sparkGlow)">
    <circle cx="250" cy="380" r="3">
      <animate attributeName="cy" values="380;30" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="250;270;230;250" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="380" r="2.5">
      <animate attributeName="cy" values="380;50" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="420;400;440;420" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="580" cy="380" r="3.5">
      <animate attributeName="cy" values="380;20" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="580;610;560;580" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="380" r="2.8">
      <animate attributeName="cy" values="380;40" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="750;730;770;750" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920" cy="380" r="3.2">
      <animate attributeName="cy" values="380;60" dur="4.6s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="920;950;900;920" dur="4.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1060" cy="380" r="2">
      <animate attributeName="cy" values="380;70" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- TEXTO ARDIENTE INFERIOR -->
  <g transform="translate(600, 310)">
    <text x="0" y="0" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="900" fill="#fef08a" letter-spacing="8" filter="url(#heatGlow)">
      RACHA ACADÉMICA ON FIRE
    </text>
    <text x="0" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800" fill="#f97316" letter-spacing="5">
      ★ NIVEL SUPERIOR · PARTICIPACIÓN &amp; XP IMPARABLE ★
    </text>
  </g>

  <!-- MARCO DE RESPLANDOR CÁLIDO -->
  <rect x="25" y="25" width="1150" height="350" rx="14" fill="none" stroke="#ea580c" stroke-width="1.8" stroke-opacity="0.45" stroke-dasharray="16,8"/>
</svg>