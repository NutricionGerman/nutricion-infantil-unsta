<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Fondo Synthwave Violeta / Espacio Profundo -->
    <linearGradient id="synthSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b001a"/>
      <stop offset="60%" stop-color="#240046"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Sol de Neón con degradado caliente -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd000"/>
      <stop offset="50%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7b2cbf"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <clipPath id="horizonClip">
      <rect x="0" y="240" width="1200" height="160"/>
    </clipPath>
  </defs>

  <!-- CIELO RETRO -->
  <rect width="1200" height="400" fill="url(#synthSky)"/>

  <!-- ESTRELLAS TITILANTES -->
  <g fill="#fff" opacity="0.8">
    <circle cx="120" cy="60" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="110" r="2"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="40" r="1.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="70" r="2"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="45" r="1.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="90" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- SOL RETRO NEÓN CON LÍNEAS HORIZONTALES (SCANLINES) -->
  <g transform="translate(600, 220)">
    <circle cx="0" cy="0" r="95" fill="url(#sunGrad)" filter="url(#neonGlow)"/>
    <!-- Franjas negras de corte retro -->
    <rect x="-100" y="-10" width="200" height="5" fill="#1b0033"/>
    <rect x="-100" y="8" width="200" height="7" fill="#1b0033"/>
    <rect x="-100" y="28" width="200" height="10" fill="#1b0033"/>
    <rect x="-100" y="52" width="200" height="13" fill="#1b0033"/>
    <rect x="-100" y="80" width="200" height="16" fill="#1b0033"/>
  </g>

  <!-- LÍNEA DEL HORIZONTE RADIANTE -->
  <line x1="0" y1="240" x2="1200" y2="240" stroke="#00f2fe" stroke-width="3" filter="url(#neonGlow)"/>

  <!-- CUADRÍCULA 3D DE PERSPECTIVA RETROWAVE (PISO EN MOVIMIENTO) -->
  <g clip-path="url(#horizonClip)">
    <!-- Líneas de fuga que convergen en el centro del horizonte -->
    <g stroke="#00f2fe" stroke-width="1.2" opacity="0.6">
      <line x1="600" y1="240" x2="-200" y2="400"/>
      <line x1="600" y1="240" x2="0" y2="400"/>
      <line x1="600" y1="240" x2="160" y2="400"/>
      <line x1="600" y1="240" x2="320" y2="400"/>
      <line x1="600" y1="240" x2="480" y2="400"/>
      <line x1="600" y1="240" x2="600" y2="400"/>
      <line x1="600" y1="240" x2="720" y2="400"/>
      <line x1="600" y1="240" x2="880" y2="400"/>
      <line x1="600" y1="240" x2="1040" y2="400"/>
      <line x1="600" y1="240" x2="1200" y2="400"/>
      <line x1="600" y1="240" x2="1400" y2="400"/>
    </g>

    <!-- Líneas horizontales en perspectiva animada hacia la cámara -->
    <g stroke="#ff007f" stroke-width="1.8" opacity="0.8">
      <line x1="0" y1="245" x2="1200" y2="245"/>
      <line x1="0" y1="255" x2="1200" y2="255"/>
      <line x1="0" y1="270" x2="1200" y2="270"/>
      <line x1="0" y1="295" x2="1200" y2="295"/>
      <line x1="0" y1="330" x2="1200" y2="330"/>
      <line x1="0" y1="375" x2="1200" y2="375"/>
    </g>
  </g>

  <!-- TIPOGRAFÍA RETRO SYNTH -->
  <g transform="translate(600, 100)">
    <text x="0" y="0" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="10" filter="url(#neonGlow)">
      PORTAL GAMIFICADO
    </text>
    <text x="0" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#00f2fe" letter-spacing="6">
      ★ LEVEL UP · CÁTEDRA DE NUTRICIÓN UNSTA ★
    </text>
  </g>

  
  
</svg>