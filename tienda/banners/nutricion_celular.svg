<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Fondo Vital Esmeralda & Amatista -->
    <radialGradient id="bioBg" cx="50%" cy="50%" r="85%">
      <stop offset="0%" stop-color="#0f2b23" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#091815" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#040a08" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="pulseLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="25%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#38ef7d" stop-opacity="1"/>
      <stop offset="75%" stop-color="#11998e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>

    <filter id="vitalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Módulo Hexagonal de Matriz Celular -->
    <g id="hexUnit">
      <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="none" stroke="#10b981" stroke-width="1.2" opacity="0.45"/>
      <circle cx="0" cy="0" r="3.5" fill="#34d399" opacity="0.6"/>
    </g>
  </defs>

  <!-- FONDO PROFUNDO -->
  <rect width="1200" height="400" fill="url(#bioBg)"/>

  <!-- RED HEXAGONAL DE MATRIZ NUTRICIONAL EN FLOTACIÓN -->
  <g opacity="0.35">
    <g transform="translate(180, 160)">
      <use href="#hexUnit"/>
      <use href="#hexUnit" x="48" y="0"/>
      <use href="#hexUnit" x="24" y="42"/>
      <use href="#hexUnit" x="-24" y="42"/>
      <animateTransform attributeName="transform" type="translate" values="180,160; 180,150; 180,160" dur="8s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(980, 150)">
      <use href="#hexUnit"/>
      <use href="#hexUnit" x="48" y="0"/>
      <use href="#hexUnit" x="24" y="42"/>
      <use href="#hexUnit" x="-24" y="42"/>
      <animateTransform attributeName="transform" type="translate" values="980,150; 980,165; 980,150" dur="9s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ONDA VITAL / PULSO METABÓLICO EN EL CENTRO -->
  <g filter="url(#vitalGlow)">
    <path d="M 0,220 L 380,220 L 410,220 L 430,150 L 450,270 L 470,180 L 490,240 L 510,220 L 690,220 L 710,130 L 730,290 L 750,170 L 770,250 L 790,220 L 1200,220" 
          fill="none" stroke="url(#pulseLineGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" values="0,1500; 1500,0; 0,1500" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- NÚCLEO BIOCELULAR CENTRAL -->
  <g transform="translate(600, 170)">
    <!-- Órbitas Bioquímicas -->
    <ellipse cx="0" cy="0" rx="90" ry="35" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="90" ry="35" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="18s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="90" ry="35" fill="none" stroke="#a7f3d0" stroke-width="1.5" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="18s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Centro Esmeralda Radiante -->
    <circle cx="0" cy="0" r="22" fill="url(#emeraldGrad)" filter="url(#vitalGlow)">
      <animate attributeName="r" values="18;24;18" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="10" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- ESFERAS DE NUTRIENTES EN ÓRBITA -->
  <g filter="url(#vitalGlow)">
    <circle cx="480" cy="110" r="5" fill="#38ef7d">
      <animate attributeName="cy" values="110;95;110" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="110" r="5" fill="#00f2fe">
      <animate attributeName="cy" values="110;125;110" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- TEXTO CIENTÍFICO INFERIOR -->
  <g transform="translate(600, 315)">
    <text x="0" y="0" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="900" fill="#34d399" letter-spacing="8" filter="url(#vitalGlow)">
      METABOLISMO &amp; FISIOLOGÍA VITAL
    </text>
    <text x="0" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#93c5fd" letter-spacing="4">
      [ MATRIZ NUTRICIONAL · CÁTEDRA NUTRICIÓN INFANTIL UNSTA ]
    </text>
  </g>

  <!-- MARCO PERIMETRAL VITAL -->
  <rect x="25" y="25" width="1150" height="350" rx="16" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="10,12"/>
</svg>