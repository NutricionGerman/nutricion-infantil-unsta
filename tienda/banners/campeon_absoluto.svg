<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- 1. Fondo Abismal Dorado Obsidiana -->
    <radialGradient id="caBgGlow" cx="50%" cy="50%" r="85%">
      <stop offset="0%" stop-color="#2a1d06" stop-opacity="0.98"/>
      <stop offset="35%" stop-color="#140e03" stop-opacity="0.99"/>
      <stop offset="100%" stop-color="#050402" stop-opacity="1"/>
    </radialGradient>

    <!-- 2. Oro Líquido 24K Dinámico con Brillo Continuo -->
    <linearGradient id="caGoldShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309">
        <animate attributeName="stop-color" values="#b45309; #fef08a; #d97706; #ffffff; #b45309" dur="4.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="25%" stop-color="#fef08a">
        <animate attributeName="stop-color" values="#fef08a; #d97706; #ffffff; #b45309; #fef08a" dur="4.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#d97706">
        <animate attributeName="stop-color" values="#d97706; #ffffff; #b45309; #fef08a; #d97706" dur="4.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="75%" stop-color="#ffffff">
        <animate attributeName="stop-color" values="#ffffff; #b45309; #fef08a; #d97706; #ffffff" dur="4.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#b45309">
        <animate attributeName="stop-color" values="#b45309; #fef08a; #d97706; #ffffff; #b45309" dur="4.5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- 3. Degradados Laterales para Flujos de Triunfo -->
    <linearGradient id="caStreamLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="caStreamRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <!-- Haz Cónico de Luz Central -->
    <linearGradient id="caGodRay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </linearGradient>

    <!-- 4. Filtros de Iluminación y Aura -->
    <filter id="caAuraGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="caFlash" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="caSubtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. FONDO FULL-BLEED SIN BORDES RÍGIDOS -->
  <rect width="1200" height="400" fill="url(#caBgGlow)"/>

  <!-- 2. RAYOS CELESTIALES DE VICTORIA (ROTACIÓN LENTA) -->
  <g transform="translate(600, 200)" opacity="0.38">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="45s" repeatCount="indefinite"/>
      <polygon points="0,0 -50,-550 50,-550" fill="url(#caGodRay)"/>
      <polygon points="0,0 -50,550 50,550" fill="url(#caGodRay)"/>
      <polygon points="0,0 -550,-50 -550,50" fill="url(#caGodRay)"/>
      <polygon points="0,0 550,-50 550,50" fill="url(#caGodRay)"/>
      <polygon points="0,0 -380,-380 -310,-440" fill="url(#caGodRay)"/>
      <polygon points="0,0 380,380 310,440" fill="url(#caGodRay)"/>
      <polygon points="0,0 -380,380 -310,440" fill="url(#caGodRay)"/>
      <polygon points="0,0 380,-380 310,-440" fill="url(#caGodRay)"/>
    </g>
  </g>

  <!-- 3. EFECTOS LATERALES DINÁMICOS (RISTRAS DE PODER Y CHEVRONS) -->
  <!-- Lateral Izquierdo -->
  <g opacity="0.8" filter="url(#caSubtleGlow)">
    <path d="M 0,185 Q 160,155 330,195 T 480,200" fill="none" stroke="url(#caStreamLeft)" stroke-width="2.5">
      <animate attributeName="stroke-dasharray" values="0,550; 550,0; 0,550" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 0,215 Q 180,245 350,205 T 480,200" fill="none" stroke="url(#caStreamLeft)" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="550,0; 0,550; 550,0" dur="4.2s" repeatCount="indefinite"/>
    </path>
    <!-- Chevrons dorados hacia el centro -->
    <path d="M 170,188 L 188,200 L 170,212" fill="none" stroke="#ffd700" stroke-width="2.2" stroke-linecap="round" opacity="0.8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 205,188 L 223,200 L 205,212" fill="none" stroke="#fef08a" stroke-width="2.2" stroke-linecap="round" opacity="0.6">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 240,188 L 258,200 L 240,212" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" opacity="0.4">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Lateral Derecho -->
  <g opacity="0.8" filter="url(#caSubtleGlow)">
    <path d="M 720,200 Q 870,160 1030,205 T 1200,185" fill="none" stroke="url(#caStreamRight)" stroke-width="2.5">
      <animate attributeName="stroke-dasharray" values="0,550; 550,0; 0,550" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 720,200 Q 890,240 1050,195 T 1200,215" fill="none" stroke="url(#caStreamRight)" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="550,0; 0,550; 550,0" dur="4.2s" repeatCount="indefinite"/>
    </path>
    <!-- Chevrons dorados hacia el centro -->
    <path d="M 1030,188 L 1012,200 L 1030,212" fill="none" stroke="#ffd700" stroke-width="2.2" stroke-linecap="round" opacity="0.8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 995,188 L 977,200 L 995,212" fill="none" stroke="#fef08a" stroke-width="2.2" stroke-linecap="round" opacity="0.6">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 960,188 L 942,200 L 960,212" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" opacity="0.4">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 4. ONDAS EXPANSIVAS CONCÉNTRICAS DE GLORIA -->
  <circle cx="600" cy="200" r="90" fill="none" stroke="url(#caGoldShimmer)" stroke-width="1.8" opacity="0.6" filter="url(#caAuraGlow)">
    <animate attributeName="r" values="75;195;75" dur="3.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.05;0.8" dur="3.8s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="2.2;0.5;2.2" dur="3.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 5. ANILLO SAGRADO SOLAR ORBITAL (GEOMETRÍA DE PRECISIÓN) -->
  <g transform="translate(600, 200)" opacity="0.5">
    <!-- Círculo interior con marcas -->
    <circle r="120" fill="none" stroke="#ffd700" stroke-width="1.2" stroke-dasharray="4,8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="50s" repeatCount="indefinite"/>
    </circle>
    <!-- Círculo exterior con segmentos -->
    <circle r="142" fill="none" stroke="url(#caGoldShimmer)" stroke-width="1.5" stroke-dasharray="14,14,35,14">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="40s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 6. NÚCLEO CENTRAL DEL CAMPEÓN ABSOLUTO (CENTRADO EXACTO EN 600, 200) -->
  <g transform="translate(600, 200)" filter="url(#caAuraGlow)">

    <!-- ALAS DE VICTORIA FACETADAS (ESTILO ÉGIDA CELESTIAL) -->
    <!-- Ala Izquierda -->
    <g opacity="0.92">
      <!-- Pluma Superior Principal -->
      <path d="M -25,-25 C -75,-65 -130,-50 -185,-15 C -135,-15 -85,5 -25,0 Z" fill="url(#caGoldShimmer)">
        <animate attributeName="transform" type="translate" values="0,0; -4,-3; 0,0" dur="3s" repeatCount="indefinite"/>
      </path>
      <!-- Pluma Media -->
      <path d="M -25,0 C -70,-20 -120,-5 -165,25 C -120,15 -75,25 -25,20 Z" fill="url(#caGoldShimmer)" opacity="0.85">
        <animate attributeName="transform" type="translate" values="0,0; -3,-1; 0,0" dur="3.2s" repeatCount="indefinite"/>
      </path>
      <!-- Pluma Inferior -->
      <path d="M -25,20 C -60,15 -100,25 -140,55 C -100,45 -60,40 -25,35 Z" fill="url(#caGoldShimmer)" opacity="0.7">
        <animate attributeName="transform" type="translate" values="0,0; -2,1; 0,0" dur="3.4s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Ala Derecha -->
    <g opacity="0.92">
      <!-- Pluma Superior Principal -->
      <path d="M 25,-25 C 75,-65 130,-50 185,-15 C 135,-15 85,5 25,0 Z" fill="url(#caGoldShimmer)">
        <animate attributeName="transform" type="translate" values="0,0; 4,-3; 0,0" dur="3s" repeatCount="indefinite"/>
      </path>
      <!-- Pluma Media -->
      <path d="M 25,0 C 70,-20 120,-5 165,25 C 120,15 75,25 25,20 Z" fill="url(#caGoldShimmer)" opacity="0.85">
        <animate attributeName="transform" type="translate" values="0,0; 3,-1; 0,0" dur="3.2s" repeatCount="indefinite"/>
      </path>
      <!-- Pluma Inferior -->
      <path d="M 25,20 C 60,15 100,25 140,55 C 100,45 60,40 25,35 Z" fill="url(#caGoldShimmer)" opacity="0.7">
        <animate attributeName="transform" type="translate" values="0,0; 2,1; 0,0" dur="3.4s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- ESCUDO DE ARMAS / TROFEO SAGRADO CENTRAL -->
    <!-- Copa Imperial Sculpted -->
    <g>
      <!-- Base y Pedestal del Trofeo -->
      <path d="M -22,65 L 22,65 L 18,52 L -18,52 Z" fill="url(#caGoldShimmer)"/>
      <rect x="-8" y="32" width="16" height="22" rx="3" fill="#ffd700"/>
      <ellipse cx="0" cy="32" rx="14" ry="4" fill="#ffffff" opacity="0.8"/>

      <!-- Cuerpo Principal del Cáliz / Escudo -->
      <path d="M -35,-20 C -35,28 -18,36 0,36 C 18,36 35,28 35,-20 Z" fill="url(#caGoldShimmer)"/>
      
      <!-- Relieve Metálico Interior -->
      <path d="M -28,-18 C -28,22 -14,29 0,29 C 14,29 28,22 28,-18 Z" fill="#181204" opacity="0.9"/>
      
      <!-- Asas Ornamentadas del Trofeo -->
      <path d="M -35,-15 C -55,-15 -55,15 -32,18 C -36,10 -36,0 -35,-15 Z" fill="url(#caGoldShimmer)" opacity="0.95"/>
      <path d="M 35,-15 C 55,-15 55,15 32,18 C 36,10 36,0 35,-15 Z" fill="url(#caGoldShimmer)" opacity="0.95"/>

      <!-- NÚMERO ROMANO "I" DORADO INCANDESCENTE -->
      <g transform="translate(0, 4)" filter="url(#caFlash)">
        <!-- Remates del I -->
        <rect x="-11" y="-14" width="22" height="4" rx="1.5" fill="#ffffff"/>
        <rect x="-11" y="10" width="22" height="4" rx="1.5" fill="#ffffff"/>
        <!-- Columna del I -->
        <rect x="-4.5" y="-12" width="9" height="24" rx="2" fill="#ffffff"/>
      </g>
      <!-- Shimmer encima del I -->
      <g transform="translate(0, 4)">
        <rect x="-9" y="-13" width="18" height="2.5" fill="#fef08a"/>
        <rect x="-9" y="10.5" width="18" height="2.5" fill="#fef08a"/>
        <rect x="-3" y="-10" width="6" height="20" fill="url(#caGoldShimmer)"/>
      </g>
    </g>

    <!-- CORONA IMPERIAL SUPERIOR SUSPENDIDA -->
    <g transform="translate(0, -38)">
      <!-- Base de la Corona -->
      <path d="M -30,0 L 30,0 L 25,-4 L -25,-4 Z" fill="url(#caGoldShimmer)"/>
      
      <!-- 5 Puntas Triunfales de la Corona -->
      <path d="M -28,-4 L -32,-24 L -16,-10 L 0,-32 L 16,-10 L 32,-24 L 28,-4 Z" fill="url(#caGoldShimmer)"/>

      <!-- Gemas Brillantes de las Puntas -->
      <circle cx="0" cy="-34" r="4.5" fill="#ffffff" filter="url(#caFlash)">
        <animate attributeName="r" values="3.5;5.5;3.5" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-32" cy="-25" r="2.8" fill="#ffd700"/>
      <circle cx="32" cy="-25" r="2.8" fill="#ffd700"/>
      <circle cx="-16" cy="-11" r="2.2" fill="#ffd700"/>
      <circle cx="16" cy="-11" r="2.2" fill="#ffd700"/>
    </g>

    <!-- DIAMOND STARBURST CENTRAL (DESTIELLO DE DIAMANTE FLOTANTE) -->
    <g transform="translate(0, -58)" filter="url(#caFlash)">
      <polygon points="0,-16 3,-3 16,0 3,3 0,16 -3,3 -16,0 -3,-3" fill="#ffffff">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.75;1;0.75" dur="1.5s" repeatCount="indefinite"/>
      </polygon>
      <circle cx="0" cy="0" r="3" fill="#fff"/>
    </g>

    <!-- LAURELES DE LA GLORIA INFERIORES -->
    <g opacity="0.9">
      <!-- Laurel Izquierdo -->
      <path d="M 0,55 C -35,55 -65,40 -80,15 C -65,30 -35,42 0,48 Z" fill="url(#caGoldShimmer)"/>
      <circle cx="-80" cy="15" r="3.2" fill="#fef08a" filter="url(#caSubtleGlow)"/>
      <!-- Laurel Derecho -->
      <path d="M 0,55 C 35,55 65,40 80,15 C 65,30 35,42 0,48 Z" fill="url(#caGoldShimmer)"/>
      <circle cx="80" cy="15" r="3.2" fill="#fef08a" filter="url(#caSubtleGlow)"/>
    </g>

    <!-- BANNER CINTA DE TEXTO: CAMPEÓN ABSOLUTO -->
    <g transform="translate(0, 80)">
      <path d="M -110,-12 L 110,-12 L 100,10 L -100,10 Z" fill="rgba(8, 6, 2, 0.88)" stroke="url(#caGoldShimmer)" stroke-width="1.2"/>
      <text x="0" y="3" text-anchor="middle" font-family="'Cinzel', 'Inter', system-ui, sans-serif" font-size="10.5" font-weight="900" fill="url(#caGoldShimmer)" letter-spacing="4">
        ★ CAMPEÓN ABSOLUTO ★
      </text>
    </g>
  </g>

  <!-- 7. CHISPAS DE ORO FLOTANTES EN ASCENSIÓN (PARTÍCULAS CÓSMICAS) -->
  <g fill="#fef08a" filter="url(#caSubtleGlow)">
    <circle cx="160" cy="330" r="2.2">
      <animate attributeName="cy" values="380;40" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="290" cy="290" r="2.8">
      <animate attributeName="cy" values="380;30" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="430" cy="340" r="1.8">
      <animate attributeName="cy" values="380;50" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="770" cy="350" r="2.5">
      <animate attributeName="cy" values="380;40" dur="7.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="7.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="910" cy="310" r="3.2">
      <animate attributeName="cy" values="380;25" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="360" r="2">
      <animate attributeName="cy" values="380;60" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>